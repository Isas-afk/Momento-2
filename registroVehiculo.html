<!DOCTYPE html <html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GVP - Registro de Usuario</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Montserrat:wght@100..800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="global.css" />
    <link rel="stylesheet" href="margin.css" />
    <link rel="stylesheet" href="variables.css" />
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- REGISTRO DE VEHÍCULO -->
    <div class="formulario">

        <h1>Registro de Vehículo</h1>
        <p>Ingresa la información del vehículo</p>

        <form>

            <label>Marca del vehículo</label>
            <input type="text" placeholder="Ej: Toyota">

            <label>Modelo del vehículo</label>
            <input type="text" placeholder="Ej: Corolla">

            <label>Placa del vehículo</label>
            <input type="text" placeholder="Ej: ABC 123">
            <label> Color del Vehiculo </label>
            <input type="text" placeholder="Ej: negro">

            <button type="submit">Guardar información</button>

        </form>
    </div>
</body>

</html>
