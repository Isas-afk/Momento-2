<!DOCTYPE html>
<html lang="es">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
        <title> GVP - Registro de Usuario </title>
        <link rel="stylesheet" href="style.css">
<head>
    <body> 
     <div class="formulario">
<h1> Registro de Usuario </h1>
<p> Ingresa la información del Usuario </p>
<form>
         <label> Nombre Completo </label>
          <input type="text" placeholder="Ej: Neil Adonai Torres Zavarce">
           <label> Fecha de Nacimiento </label>
          <input type="date">
           <label> Cédula de Ciudadanía </label>
          <input type="text" placeholder="Ej: 1.045.532.146">
          <label> Dirección </label>
          <input type="text" placeholder="Ej: calle 37 #42-32">
          <label> Correo Electrónico</label>
           <input type="email" placeholder="Ej: usuario@correo.com"> 
          <label> Ciudad </label>
          <input type="text" placeholder="Ej: Bello">
           <label> Teléfono Principal </label>
          <input type="tel" placeholder="Ej: 324 327 1387">
          <label> Género </label>
 <select>
           <option value=""> Selecciona una opción </option>
           <option> Masculino </option>
           <option> Femenino </option>
           <option> otro </option>
           <option> Pefiero no decirlo </option>
 </select>
           <label> Teléfono Alterno </label>
           <input type="tel" placeholder="Ej: 324 327 1387">
           <label> Tipo de Usuario </label>
 <select> 
           <option value="Selecciona una Opción">
           <option>Cliente</option>
           <option>Dueño de Parqueadero</option>
 </select>
          <button type="submit"> Guardar Información </button>
         </form>
         </div>

         </div>

    <!-- REGISTRO DE VEHÍCULO -->
    <div class="formulario">

        <h1>Registro de Vehículo</h1>
        <p>Ingresa la información del vehículo</p>

        <form>

            <label>Marca del vehículo</label>
            <input type="text" placeholder="Ej: Toyota">

            <label>Modelo del vehículo</label>
            <input type="text" placeholder="Ej: Corolla">

            <label>Placa del vehículo</label>
            <input type="text" placeholder="Ej: ABC 123">
            <label> Color del Vehiculo </label>
             <input type="text" placeholder="Ej: negro">

            <button type="submit">Guardar información</button>

        </form>
     </div>
    </body>
</html>
