<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GVP - Registro de Parqueadero</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="formulario">

        <h1>Registro de Parqueadero</h1>
        <p>Ingresa la información del propietario y del parqueadero</p>

        <form>

            <label>Nombre del Propietario</label>
            <input type="text" placeholder="Ej: Parqueadero Centro">

            <label>Cédula</label>
            <input type="text" placeholder="Ej: 1.234.567.890">

            <label>Número de telefono</label>
            <input type="tel" placeholder="Ej: 300 123 4567">

            <label>Nombre del Parqueadero</label>
            <input type="text" placeholder="Ej: Juan Pérez García">

            <label>Dirección del parqueadero</label>
            <input type="text" placeholder="Ej: Calle 50 # 45-20">

            <label>Número de telefono del parqueadero</label>
            <input type="text" placeholder="Ej: 001">

            <label>NIT del parqueadero</label>
            <input type="text" placeholder="Ej: 900.123.456-7">

            <button type="submit">Guardar información</button>

        </form>

    </div>

</body>
</html>
